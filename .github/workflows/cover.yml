name: Cover messen

# Holt die Cover der Spitzentitel aus den gemessenen KDP-Nischen, legt sie
# als Kontaktbogen nebeneinander und misst Format, Helligkeit, Kontrast,
# Sättigung, Farbanteile und die Lage der Kantenenergie.
#
# Warum ein eigener Lauf und nicht in "Shop messen": Dort hängen webcheck
# und Lighthouse mit dran, das dauert eine halbe Stunde und braucht den
# Shop. Für Cover braucht es nur einen Browser und zehn Minuten.
#
# Die Arbeitsumgebung erreicht amazon.de nicht — ohne diesen Lauf gibt es
# keine Cover und damit kein Urteil über die Nische, nur Erinnerung.
on:
  workflow_dispatch:
    inputs:
      begriffe:
        description: "Suchbegriffe, durch | getrennt"
        required: true
        default: "geheimes baby liebesroman|milliardär liebesroman|ceo liebesroman"
      markt:
        description: "Marktplatz: de oder com"
        required: false
        default: "de"
      anzahl:
        description: "Cover je Nische"
        required: false
        default: "12"

permissions:
  contents: write

# Wie bei "Shop messen": Läufe warten aufeinander. Zwei gleichzeitige
# Läufe würden dieselben Bilddateien und dieselbe JSON schreiben.
concurrency:
  group: cover-messen
  cancel-in-progress: false

jobs:
  messen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Browser einrichten
        run: |
          pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium

      # Zuerst die Kalibrierung, allein. Schlaegt sie fehl, wird gar nicht
      # erst gemessen -- ein unkalibriertes Messgeraet liefert Zahlen, die
      # schlimmer sind als keine.
      - name: Messgerät kalibrieren
        run: python3 scripts/cover.py --selbsttest

      # Kleinvolumig und nur lesend, mit Pausen. Amazons
      # Nutzungsbedingungen untersagen automatisierten Zugriff; das ist
      # eine Grauzone und im Skriptkopf dokumentiert.
      # Trenner ist |, nicht das Leerzeichen -- "geheimes baby
      # liebesroman" besteht aus drei Woertern.
      - name: Cover holen und messen
        env:
          BEGRIFFE: ${{ inputs.begriffe }}
          MARKT: ${{ inputs.markt }}
          ANZAHL: ${{ inputs.anzahl }}
        run: |
          python3 - <<'PY' > /tmp/begriffe.txt
          import os
          for b in os.environ["BEGRIFFE"].split("|"):
              b = b.strip()
              if b:
                  print(b)
          PY
          mapfile -t BEGRIFFE < /tmp/begriffe.txt
          printf 'Begriff: %s\n' "${BEGRIFFE[@]}"
          python3 scripts/cover.py --markt "$MARKT" --anzahl "$ANZAHL" \
            --begriffe "${BEGRIFFE[@]}"

      - name: Bericht in die Zusammenfassung
        if: always()
        run: '[ -f COVER.md ] && cat COVER.md >> $GITHUB_STEP_SUMMARY || true'

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cover COVER.md daten/cover.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git commit -m "Cover-Messung vom $(date +%Y-%m-%d)"
          for v in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git fetch origin "$GITHUB_REF_NAME"
            git rebase -X theirs "origin/$GITHUB_REF_NAME" || { git rebase --abort; true; }
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((v * 4))
          done
          echo "Push nach drei Versuchen fehlgeschlagen." >&2
          exit 1
