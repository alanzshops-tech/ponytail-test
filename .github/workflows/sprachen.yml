name: Sprachfassungen prüfen

# Liest Canonical und hreflang der deutschen und englischen Fassungen.
# Anlass: sieben deutsche Suchanfragen landen auf englischen URLs
# (GSC.md, 11.08.2026). Nur der Runner erreicht homeeins.de.
#
# Rein lesend. Kein Zugang zum Laden, keine Zugangsdaten, keine
# Schreibrechte am Theme — nur HTTP-Abrufe der öffentlichen Seiten.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adressliste"
        type: string
        default: "urls-sprachen.txt"

permissions:
  contents: write

jobs:
  sprachen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Erst die Gegenprobe, dann die Messung. Ein Parser, der die
      # Skriptfalle nicht besteht, darf gar nicht erst gegen den echten
      # Shop laufen — sonst steht am Ende eine Zahl, der niemand
      # ansieht, dass sie falsch ist.
      - name: Gegenprobe
        run: python3 scripts/probe_sprachen.py

      - name: Messen
        run: python3 scripts/sprachen.py --urls "${{ inputs.urls || 'urls-sprachen.txt' }}"

      - name: Bericht in die Zusammenfassung
        if: always()
        run: '[ -f SPRACHEN.md ] && cat SPRACHEN.md >> $GITHUB_STEP_SUMMARY || true'

      - name: Ergebnis committen
        if: always()
        run: |
          [ -f SPRACHEN.md ] || { echo "Nichts gemessen."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SPRACHEN.md daten/sprachen-aktuell.json
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git commit -m "Sprachfassungen gemessen $(date +%Y-%m-%d)"
          for v in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git fetch origin "${GITHUB_REF_NAME}" || { sleep $((v * 5)); continue; }
            if git rebase --autostash "origin/${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push-Versuch $v fehlgeschlagen, neuer Versuch ..."
            sleep $((v * 5))
          done
          exit 1
