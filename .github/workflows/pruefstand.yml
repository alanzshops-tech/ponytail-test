name: Prüfstand

# Barrierefreiheit, Lesbarkeit und Pixelvergleich. Alles quelloffen,
# alles ohne Konto, alles gegen die echte Seite — die abgeschottete
# Arbeitsumgebung erreicht homeeins.de nicht.
on:
  workflow_dispatch:
    inputs:
      grundlinie:
        description: "Aufnahmen als neue Vergleichsbasis ablegen"
        type: boolean
        default: false
  push:
    branches: ["claude/**"]
    paths:
      - "scripts/pruefstand.py"
      - ".github/workflows/pruefstand.yml"
  schedule:
    - cron: "30 7 * * 1"

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Werkzeuge einrichten
        run: |
          pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium
          # axe-core wird als Datei eingebunden, nicht aus einem CDN.
          npm install --no-save --silent axe-core
          node -e "console.log('axe-core', require('axe-core/package.json').version)"

      - name: Messen
        env:
          GRUNDLINIE: ${{ inputs.grundlinie }}
        run: |
          if [ "$GRUNDLINIE" = "true" ]; then
            python3 scripts/pruefstand.py --urls urls-shop.txt --grundlinie
          else
            python3 scripts/pruefstand.py --urls urls-shop.txt
          fi

      - name: Bericht in die Zusammenfassung
        if: always()
        run: '[ -f PRUEFSTAND.md ] && cat PRUEFSTAND.md >> $GITHUB_STEP_SUMMARY || true'

      - name: Ergebnis committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/pruefstand PRUEFSTAND.md daten/pruefstand.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git commit -m "Prüfstand vom $(date +%Y-%m-%d)"
          for v in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((v * 5))
          done
          exit 1
