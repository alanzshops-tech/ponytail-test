name: Reels rendern

# Drei Wege, den Lauf auszulösen:
#   push              — sobald sich Skript oder Konfiguration ändern
#   workflow_dispatch — Knopf in der Actions-Oberfläche (erst ab main verfügbar)
#   schedule          — wöchentlich
#
# Der Runner hat freien Netzzugang. Deshalb läuft hier, was in einer
# abgeschotteten Umgebung nicht geht: Bilder von der Shopify-CDN holen,
# mit FFmpeg rendern, Ergebnis öffentlich bereitstellen.
on:
  push:
    branches:
      - "claude/**"
      - main
    paths:
      - "reels.config.json"
      - "scripts/make_reels.py"
      - ".github/workflows/reels.yml"
  workflow_dispatch:
    inputs:
      nur:
        description: "Nur ein Produkt rendern (name aus reels.config.json), leer = alle"
        required: false
        default: ""
  schedule:
    - cron: "0 4 * * 1"

# contents: write wird gebraucht, um die fertigen MP4s als Release-Assets
# zu veröffentlichen. Das gibt jedem Video eine dauerhafte öffentliche URL,
# ohne die Videos ins Git zu committen.
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: FFmpeg und Schriften installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          echo "--- Version ---"
          ffmpeg -version | head -1
          echo "--- drawtext vorhanden? ---"
          ffmpeg -hide_banner -filters | grep -c " drawtext " || echo "FEHLT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install --quiet requests

      - name: Reels rendern
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python3 scripts/make_reels.py \
            --config reels.config.json \
            --out dist \
            ${{ inputs.nur && format('--nur {0}', inputs.nur) || '' }}

      - name: Dauer und Format prüfen
        run: |
          for f in dist/*.mp4; do
            echo "--- $f ---"
            ffprobe -v error -show_entries format=duration,size \
              -show_entries stream=codec_name,width,height,r_frame_rate \
              -of default=noprint_wrappers=1 "$f"
          done

      # Öffentliche URLs ohne Cloudinary: Release-Assets eines öffentlichen
      # Repos sind ohne Anmeldung abrufbar. Metricool kann sie damit laden.
      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="reels-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" dist/*.mp4 \
            --title "Reels $TAG" \
            --notes "Automatisch gerendert aus reels.config.json" \
            --target "${{ github.sha }}"
          echo "### Öffentliche Reel-URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in dist/*.mp4; do
            n=$(basename "$f")
            echo "- \`$n\` → https://github.com/${{ github.repository }}/releases/download/$TAG/$n" \
              >> $GITHUB_STEP_SUMMARY
          done

      - uses: actions/upload-artifact@v4
        with:
          name: reels
          path: dist/
          retention-days: 30
