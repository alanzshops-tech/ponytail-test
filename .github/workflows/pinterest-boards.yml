name: Pinterest-Pinnwände auslesen

# Einmalige Hilfe: Das öffentliche Pinterest-Profil abrufen und die Namen der
# Pinnwände herausziehen. Nötig, weil Metricool beim Einplanen den Namen oder
# die numerische ID der Pinnwand verlangt, seine Board-Liste aber nur über
# einen angemeldeten Endpunkt herausgibt.
#
# Liest ausschließlich öffentlich sichtbare Daten des eigenen Profils.
#
# Der push-Auslöser ist nötig, weil workflow_dispatch erst zur Verfügung
# steht, wenn die Datei auf dem Standardbranch liegt.
on:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/pinterest-boards.yml"
  workflow_dispatch:
    inputs:
      profil:
        description: "Pinterest-Benutzername (ohne pinterest.de/)"
        required: false
        default: "homeeins"

jobs:
  boards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extraktor schreiben
        run: |
          cat > boards.py <<'PY'
          import json, re, sys, pathlib

          roh = pathlib.Path(sys.argv[1]).read_text("utf-8", "replace")
          treffer = {}

          # Pinterest bettet den Profilzustand als JSON in <script>-Bloecke ein.
          # Die Struktur aendert sich regelmaessig, deshalb nicht auf einen
          # festen Pfad verlassen, sondern rekursiv nach Board-Objekten suchen.
          def sammeln(o):
              if isinstance(o, dict):
                  if o.get("type") == "board" and o.get("name"):
                      treffer[str(o.get("id"))] = o["name"]
                  for v in o.values():
                      sammeln(v)
              elif isinstance(o, list):
                  for v in o:
                      sammeln(v)

          for m in re.finditer(
                  r'<script[^>]*type="application/json"[^>]*>(.*?)</script>',
                  roh, re.S):
              try:
                  sammeln(json.loads(m.group(1)))
              except Exception:
                  pass

          if not treffer:
              # Rueckfallebene: Board-Links im Markup, /nutzer/pinnwand-slug/
              unerwuenscht = {"pins", "boards", "_saved", "_created", "settings"}
              for slug in sorted(set(re.findall(r'"/[^/"]+/([a-z0-9\-]{2,60})/"',
                                                roh))):
                  if slug not in unerwuenscht:
                      treffer["slug:" + slug] = slug.replace("-", " ")

          print("### Gefundene Pinnwaende")
          if treffer:
              for bid, name in sorted(treffer.items(), key=lambda x: x[1]):
                  print(f"  {bid}\t{name}")
          else:
              print("  keine gefunden - Profil leer, privat oder blockiert")
          PY
          python3 -c "import ast,sys; ast.parse(open('boards.py').read())"
          echo "Extraktor ok"

      - name: Profil abrufen und auswerten
        env:
          PROFIL: ${{ inputs.profil || 'homeeins' }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for host in www.pinterest.de www.pinterest.com de.pinterest.com; do
            echo "=== https://$host/$PROFIL/ ==="
            code=$(curl -sL -o seite.html -w "%{http_code}" --max-time 30 \
              -A "$UA" -H "Accept-Language: de-DE,de;q=0.9" \
              "https://$host/$PROFIL/" || echo 000)
            echo "HTTP $code, $(wc -c < seite.html) Bytes"
            if [ "$code" = "200" ]; then
              python3 boards.py seite.html | tee -a $GITHUB_STEP_SUMMARY
              exit 0
            fi
          done
          echo "Kein Host lieferte 200 - Pinterest blockt den Runner."
          exit 1
