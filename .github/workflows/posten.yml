name: Posten

# Veröffentlicht auf sieben Kanälen.
#
#   ohne jede Einrichtung: Mastodon, Bluesky, Telegram, Discord
#   eigene App, kein Review: Instagram, Facebook, TikTok
#
# Instagram und Facebook laufen im Entwicklungsmodus der eigenen
# Meta-App -- solange nur auf eigene Konten gepostet wird, ist kein
# App-Review nötig. TikTok lädt als ENTWURF ins Postfach (Scope
# video.upload); veröffentlicht wird mit einem Tipp in der App.
# Herleitung und Belege in SOCIAL-SELBSTHOSTEN.md.
#
# Läuft hier und nicht in der Arbeitsumgebung, weil die nur GitHub, PyPI
# und npm erreicht — mastodon.social, bsky.social, api.telegram.org und
# discord.com sind gesperrt. Der Runner ist Augen und Netz.
#
# Die Zugangsdaten liegen in den Repository-Secrets und werden nur als
# Umgebungsvariablen durchgereicht. Sie stehen in keinem Befehl und
# damit in keinem Protokoll (CLAUDE.md, Regel 4).
#
# **Der erste Lauf sollte "probe: true" sein.** Dann sendet nichts, und
# man sieht in der Ausgabe, welche Secrets ankommen und welche fehlen.

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Der Beitragstext"
        type: string
        required: true
      kanaele:
        description: "Komma-Liste der Kanäle"
        type: string
        default: "instagram,facebook,tiktok"
      bild:
        description: "Öffentliche https-URL des Bildes (Instagram verlangt sie)"
        type: string
        default: ""
      video:
        description: "Öffentliche https-URL des Videos (TikTok)"
        type: string
        default: ""
      probe:
        description: "Probelauf — nichts senden, nur zeigen"
        type: boolean
        default: true

jobs:
  posten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Kein pip install: posten.py benutzt nur die Standardbibliothek.
      # Das ist Absicht -- ein Postwerkzeug, das von PyPI abhaengt, faellt
      # aus, wenn dort etwas kaputt ist.
      - name: Selbsttest
        run: python3 scripts/posten.py --selbsttest

      - name: Veröffentlichen
        env:
          MASTODON_SERVER: ${{ secrets.MASTODON_SERVER }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_STANDALONE: ${{ secrets.INSTAGRAM_STANDALONE }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          python3 scripts/posten.py \
            --text "${{ inputs.text }}" \
            --kanaele "${{ inputs.kanaele }}" \
            --bild "${{ inputs.bild }}" \
            --video "${{ inputs.video }}" \
            ${{ inputs.probe && '--probe' || '' }}
