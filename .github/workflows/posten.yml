name: Posten

# Veröffentlicht auf sieben Kanälen.
#
#   ohne jede Einrichtung: Mastodon, Bluesky, Telegram, Discord
#   eigene App, kein Review: Instagram, Facebook, TikTok
#
# Instagram und Facebook laufen im Entwicklungsmodus der eigenen
# Meta-App -- solange nur auf eigene Konten gepostet wird, ist kein
# App-Review nötig. TikTok lädt als ENTWURF ins Postfach (Scope
# video.upload); veröffentlicht wird mit einem Tipp in der App.
# Herleitung und Belege in SOCIAL-SELBSTHOSTEN.md.
#
# Läuft hier und nicht in der Arbeitsumgebung, weil die nur GitHub, PyPI
# und npm erreicht — mastodon.social, bsky.social, api.telegram.org und
# discord.com sind gesperrt. Der Runner ist Augen und Netz.
#
# Die Zugangsdaten liegen in den Repository-Secrets und werden nur als
# Umgebungsvariablen durchgereicht. Sie stehen in keinem Befehl und
# damit in keinem Protokoll (CLAUDE.md, Regel 4).
#
# **Der erste Lauf sollte "probe: true" sein.** Dann sendet nichts, und
# man sieht in der Ausgabe, welche Secrets ankommen und welche fehlen.

# Der push-Ausloeser ist NICHT zum Posten da, sondern zur Registrierung.
#
# Gemessen am 03.09.2026: Ein Workflow, der nur workflow_dispatch kennt
# und noch nie gelaufen ist, steht nicht in der Workflow-Liste des
# Repositories -- POST .../workflows/posten.yml/dispatches antwortet mit
# 404. Alle 16 registrierten Workflows dieses Repositories tragen als
# head_branch diesen Entwicklungsbranch, main hat genau einen Commit mit
# einer README. Sie laufen also vom Branch; ihnen fehlte nur nie die
# Erstregistrierung, weil sie einen push-Ausloeser haben.
#
# Derselbe Kniff steht in aufraeumen.yml unter "nur zur Registrierung".
# Beim push wird deshalb ausschliesslich der Selbsttest ausgefuehrt und
# nichts veroeffentlicht -- die Eingaben sind bei einem push ohnehin
# leer.
on:
  push:
    paths:
      - ".github/workflows/posten.yml"
      - "scripts/posten.py"
  workflow_dispatch:
    inputs:
      text:
        description: "Der Beitragstext"
        type: string
        required: false
        default: ""
      kanaele:
        description: "Komma-Liste der Kanäle (leer = bei zugang alle prüfen)"
        type: string
        default: "instagram"
      bild:
        description: "Öffentliche https-URL des Bildes (Instagram verlangt sie)"
        type: string
        default: ""
      video:
        description: "Öffentliche https-URL des Videos (TikTok)"
        type: string
        default: ""
      probe:
        description: "Probelauf — nichts senden, nur zeigen"
        type: boolean
        default: true
      zugang:
        description: "Nur prüfen, ob die Zugangsdaten stimmen (nichts posten)"
        type: boolean
        default: false
      token_erneuern:
        description: "Nur das Instagram-Token um 60 Tage verlängern"
        type: boolean
        default: false

jobs:
  posten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Kein pip install: posten.py benutzt nur die Standardbibliothek.
      # Das ist Absicht -- ein Postwerkzeug, das von PyPI abhaengt, faellt
      # aus, wenn dort etwas kaputt ist.
      - name: Selbsttest
        run: python3 scripts/posten.py --selbsttest

      # Beim push ist hier Schluss. Kein Zugriff auf inputs, kein
      # Sendeversuch -- ein Werkzeug, das durch einen Commit
      # veroeffentlicht, waere eine Falle.
      - name: Nur registrieren
        if: github.event_name == 'push'
        run: |
          echo "Push-Lauf: nur Selbsttest, es wird nichts veröffentlicht."
          echo "Der Workflow ist damit registriert und lässt sich ab jetzt"
          echo "über Actions → Posten → Run workflow starten."

      - name: Veröffentlichen
        if: github.event_name == 'workflow_dispatch'
        env:
          MASTODON_SERVER: ${{ secrets.MASTODON_SERVER }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_STANDALONE: ${{ secrets.INSTAGRAM_STANDALONE }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          python3 scripts/posten.py \
            ${{ inputs.zugang && '--zugang' || '' }} \
            ${{ inputs.token_erneuern && '--token-erneuern' || '' }} \
            --text "${{ inputs.text }}" \
            --kanaele "${{ inputs.kanaele }}" \
            --bild "${{ inputs.bild }}" \
            --video "${{ inputs.video }}" \
            ${{ inputs.probe && '--probe' || '' }}
