name: Google Trends erfassen

# Holt wöchentlich die Nachfragekurven für die Suchbegriffe aus
# trends.config.json und schreibt sie zurück ins Repo. So entsteht über die
# Monate eine eigene Zeitreihe — unabhängig davon, wie weit Google Trends
# selbst zurückblicken lässt.
#
# Montags 05:00 UTC, also nach dem Reel-Rendern um 04:00.
on:
  workflow_dispatch:
# Wird gebraucht, um Ergebnis und Bericht zurück in den Branch zu committen.
permissions:
  contents: write

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          pip install --quiet pytrends pandas
          python3 -c "import pytrends, pandas; print('pytrends bereit')"

      - name: Trends abfragen
        run: python3 scripts/trends.py --config trends.config.json --out daten

      # Nischenbericht direkt hinterher: Er braucht frische Trends-Daten
      # und die letzten CJ-Daten, beide liegen dann im Arbeitsverzeichnis.
      # Faellt der CJ-Lauf aus, fehlt nur die Angebotsseite -- kein Grund,
      # den Trends-Lauf rot zu machen.
      - name: Nischen zusammenführen
        continue-on-error: true
        run: |
          if [ -f daten/cj-aktuell.json ]; then
            python3 scripts/nischen.py
          else
            echo "Keine CJ-Daten vorhanden, Nischenbericht übersprungen."
          fi

      - name: Bericht in die Zusammenfassung
        if: always()
        run: |
          if [ -f TRENDS.md ]; then cat TRENDS.md >> $GITHUB_STEP_SUMMARY; fi

      # Ergebnis versionieren. Der Commit löst keinen weiteren Lauf aus:
      # dieser Workflow reagiert nur auf Änderungen an Skript und
      # Konfiguration, nicht auf daten/ oder TRENDS.md.
      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten TRENDS.md NISCHEN.md
          if git diff --cached --quiet; then
            echo "Keine Änderung, nichts zu committen."
            exit 0
          fi
          git commit -m "Trends-Daten vom $(date +%Y-%m-%d)"
          for v in 1 2 3; do
            # Ein gescheiterter Rebase laesst das Verzeichnis im
            # Konfliktzustand zurueck. Ohne diesen Abbruch scheitert jeder
            # weitere Versuch garantiert am selben Zustand -- die Schleife
            # lief dreimal leer und meldete am Ende nur "exit 1". Genau so
            # ist der Pruefstand am 10.08.2026 rot geworden, als sich zwei
            # Laeufe ueberholt haben.
            git rebase --abort 2>/dev/null || true
            git fetch origin "${GITHUB_REF_NAME}" || { sleep $((v * 5)); continue; }
            # -X theirs meint beim Rebase die eigenen Commits, nicht die der
            # Gegenseite -- beim Rebase sind die Rollen vertauscht.
            # Aufnahmen sind Binaerdateien und lassen sich nicht
            # zusammenfuehren; sie sind erzeugt, nicht geschrieben, also hat
            # der frischere Lauf recht.
            if git rebase --autostash -X theirs "origin/${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push-Versuch $v fehlgeschlagen, neuer Versuch ..."
            sleep $((v * 5))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trends
          path: |
            daten/
            TRENDS.md
            NISCHEN.md
          retention-days: 90
          if-no-files-found: warn
