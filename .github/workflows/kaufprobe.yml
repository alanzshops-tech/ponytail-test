name: Kaufprobe

# Sieht sich die Theme-Kopie an und versucht, im Shop einzukaufen.
# Beides geht nur mit einem echten Browser im Netz — die abgeschottete
# Arbeitsumgebung erreicht homeeins.de nicht.
#
# Der Lauf bezahlt nichts. Er legt Ware in den Korb, ruft die Kasse auf
# und hört dort auf. Zurück bleibt ein abgebrochener Warenkorb auf einer
# example.com-Adresse.
on:
  workflow_dispatch:
    inputs:
      theme:
        description: "ID der Theme-Kopie für die Sichtprüfung der Startseite"
        required: true
        # Dieselbe ID wie in urls-sandbox.txt. Stand hier bis zum
        # 10.08.2026 auf 182664626499 ("Umbau Conversion") -- ein anderes
        # Sandbox-Theme als das, gegen das der Pruefstand misst. Wer ohne
        # eigene Angabe startete, sah sich damit ein anderes Theme an als
        # die uebrigen Werkzeuge.
        default: "182664790339"
      vorschau:
        description: "Theme-ID für den Kaufweg; leer = veröffentlichtes Theme"
        type: string
        default: ""
permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Browser einrichten
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Probe laufen lassen
        env:
          THEME: ${{ inputs.theme || '182664790339' }}
          VORSCHAU: ${{ inputs.vorschau }}
        run: python3 scripts/kaufprobe.py --theme "$THEME" --vorschau "$VORSCHAU"

      - name: Bericht in die Zusammenfassung
        if: always()
        run: '[ -f KAUFPROBE.md ] && cat KAUFPROBE.md >> $GITHUB_STEP_SUMMARY || true'

      - name: Ergebnis committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder KAUFPROBE.md daten/kaufprobe.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git commit -m "Kaufprobe vom $(date +%Y-%m-%d)"
          for v in 1 2 3; do
            # Ein gescheiterter Rebase laesst das Verzeichnis im
            # Konfliktzustand zurueck. Ohne diesen Abbruch scheitert jeder
            # weitere Versuch garantiert am selben Zustand -- die Schleife
            # lief dreimal leer und meldete am Ende nur "exit 1". Genau so
            # ist der Pruefstand am 10.08.2026 rot geworden, als sich zwei
            # Laeufe ueberholt haben.
            git rebase --abort 2>/dev/null || true
            git fetch origin "${GITHUB_REF_NAME}" || { sleep $((v * 5)); continue; }
            # -X theirs meint beim Rebase die eigenen Commits, nicht die der
            # Gegenseite -- beim Rebase sind die Rollen vertauscht.
            # Aufnahmen sind Binaerdateien und lassen sich nicht
            # zusammenfuehren; sie sind erzeugt, nicht geschrieben, also hat
            # der frischere Lauf recht.
            if git rebase --autostash -X theirs "origin/${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push-Versuch $v fehlgeschlagen, neuer Versuch ..."
            sleep $((v * 5))
          done
          exit 1
