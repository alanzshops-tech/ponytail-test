name: Shop messen

# Fotografiert den Shop und misst, was ein Besucher erlebt. Die
# abgeschottete Arbeitsumgebung erreicht den Shop nicht — ohne diesen
# Lauf gibt es weder Bilder noch Ladezeiten, und ohne beides kein Urteil
# über Design oder Conversion.
#
# Zusätzlich Lighthouse, Googles eigenes Messwerkzeug: Es liefert die
# Kennzahlen, nach denen Google selbst bewertet.
on:
  workflow_dispatch:
    inputs:
      zoom_pfad:
        description: "Zusätzlich Bild-Zoom auf dem Handy prüfen für diesen Produktpfad (leer = überspringen)"
        required: false
        default: ""
      schema_urls:
        description: "Zusätzlich strukturierte Daten (JSON-LD) prüfen, Leerzeichen-getrennt (leer = überspringen)"
        required: false
        default: ""
  # Montags 07:00 UTC, nach dem Search-Console-Bericht.
permissions:
  contents: write

jobs:
  messen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Browser einrichten
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Fotografieren und messen
        run: python3 scripts/webcheck.py --urls urls-shop.txt

      # Eigener, optionaler Schritt: prueft echten Tap-Zoom auf dem Handy,
      # nicht nur ob die Seite laedt. Siehe PRODUKTBILDER.md.
      - name: Bild-Zoom pruefen
        if: inputs.zoom_pfad != ''
        continue-on-error: true
        env:
          ZOOM_PFAD: ${{ inputs.zoom_pfad }}
        run: python3 scripts/zoomprobe.py --pfad "$ZOOM_PFAD"

      # Rein lesend: prueft, ob und wie vollstaendig Product-Schema
      # (JSON-LD) auf den Seiten steht. Siehe TRAFFIC.md.
      - name: Strukturierte Daten pruefen
        if: inputs.schema_urls != ''
        continue-on-error: true
        env:
          SCHEMA_URLS: ${{ inputs.schema_urls }}
        run: python3 scripts/schemaprobe.py --urls $SCHEMA_URLS

      # Lighthouse misst nach Googles eigenen Kriterien. Mobil, weil dort
      # die Mehrheit ankommt und die Schwächen sichtbarer sind.
      - name: Lighthouse
        continue-on-error: true
        run: |
          npm install -g lighthouse@12 --silent
          mkdir -p daten/lighthouse
          while read -r u; do
            case "$u" in ''|\#*) continue;; esac
            name=$(echo "$u" | sed 's|https://www.homeeins.de||; s|[^A-Za-z0-9]|-|g; s|^-*||; s|-*$||')
            [ -z "$name" ] && name=startseite
            echo "Lighthouse: $u"
            lighthouse "$u" --quiet --preset=desktop --output=json \
              --output-path="daten/lighthouse/$name.json" \
              --chrome-flags="--headless --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              || echo "  fehlgeschlagen"
          done < urls-shop.txt
          python3 - <<'PY'
          import json, pathlib
          zeilen = ["", "## Lighthouse (Google-Bewertung, Desktop)", "",
                    "| Seite | Tempo | Barrierefreiheit | Praxis | SEO |",
                    "|---|---:|---:|---:|---:|"]
          for f in sorted(pathlib.Path("daten/lighthouse").glob("*.json")):
              try:
                  d = json.loads(f.read_text())
              except Exception:
                  continue
              c = d.get("categories", {})
              def s(k):
                  v = (c.get(k) or {}).get("score")
                  return round(v * 100) if v is not None else "–"
              zeilen.append(f"| {f.stem} | {s('performance')} | "
                            f"{s('accessibility')} | {s('best-practices')} | {s('seo')} |")
          zeilen += ["", "Skala 0 bis 100. Unter 50 ist rot, ab 90 gut.", ""]
          p = pathlib.Path("WEBSITE.md")
          p.write_text(p.read_text(encoding="utf-8") + "\n".join(zeilen) + "\n",
                       encoding="utf-8")
          print("Lighthouse-Werte an WEBSITE.md angehängt")
          PY

      - name: Bericht in die Zusammenfassung
        if: always()
        run: '[ -f WEBSITE.md ] && cat WEBSITE.md >> $GITHUB_STEP_SUMMARY || true'

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder WEBSITE.md daten/webcheck-aktuell.json 2>/dev/null || true
          git add ZOOMPROBE.md daten/zoomprobe.json 2>/dev/null || true
          git add SCHEMAPROBE.md daten/schemaprobe.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git commit -m "Shop-Messung vom $(date +%Y-%m-%d)"
          for v in 1 2 3; do
            # Ein gescheiterter Rebase laesst das Verzeichnis im
            # Konfliktzustand zurueck. Ohne diesen Abbruch scheitert jeder
            # weitere Versuch garantiert am selben Zustand -- die Schleife
            # lief dreimal leer und meldete am Ende nur "exit 1". Genau so
            # ist der Pruefstand am 10.08.2026 rot geworden, als sich zwei
            # Laeufe ueberholt haben.
            git rebase --abort 2>/dev/null || true
            git fetch origin "${GITHUB_REF_NAME}" || { sleep $((v * 5)); continue; }
            # -X theirs meint beim Rebase die eigenen Commits, nicht die der
            # Gegenseite -- beim Rebase sind die Rollen vertauscht.
            # Aufnahmen sind Binaerdateien und lassen sich nicht
            # zusammenfuehren; sie sind erzeugt, nicht geschrieben, also hat
            # der frischere Lauf recht.
            if git rebase --autostash -X theirs "origin/${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push-Versuch $v fehlgeschlagen, neuer Versuch ..."
            sleep $((v * 5))
          done
          exit 1
