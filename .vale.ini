# Vale (errata-ai/vale, MIT, v3.9.1) — markup-bewusster Prosa-Linter.
#
# Warum zusaetzlich zu prosa.py: prosa.py misst Raten je Kapitel
# ("Kapitel 15 hat 17,7 Fuellwoerter je 1000"). Vale nennt die Stelle
# ("Zeile 77, Spalte 39"). Das eine sagt, wo man hinsehen soll, das
# andere, was man anfassen kann.
#
# Warum nicht proselint oder write-good: beide pruefen englische
# Idiome. Auf deutschem Text finden sie nichts oder das Falsche.
# Vale bringt keine eigenen Regeln mit -- man schreibt sie selbst,
# und genau deshalb passt es hier.
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Homeeins
